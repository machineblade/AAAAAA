<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mandelbrot × Sierpiński — Infinite Zoom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d0221; color: #ccc; font-family: monospace; overflow: hidden; }
  #c { display: block; width: 100vw; height: 100vh; cursor: crosshair; touch-action: none; }
  #hud {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(13,2,33,0.88);
    padding: 8px 14px;
    display: flex; gap: 18px; flex-wrap: wrap; align-items: center;
    font-size: 12px; border-top: 1px solid #1a0a3a;
  }
  #info { color: #13c5b0; min-width: 280px; }
  label { display: flex; align-items: center; gap: 6px; color: #8899aa; }
  input[type=range] { accent-color: #13c5b0; }
  button {
    background: #1a0a3a; border: 1px solid #13c5b0; color: #13c5b0;
    padding: 3px 10px; cursor: pointer; border-radius: 3px; font-family: monospace; font-size: 11px;
  }
  button:hover { background: #13c5b0; color: #0d0221; }
  #hint { color: #3a5a6a; font-size: 10px; }
  #depth-bar {
    position: fixed; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, #13c5b0, #a020f0);
    transform-origin: left;
    transform: scaleX(0);
    transition: transform 0.3s;
    pointer-events: none;
  }
  #webgl-error {
    display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: #1a0a3a; border: 1px solid #c03; padding: 30px; text-align: center;
    color: #f88; border-radius: 8px; max-width: 400px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="depth-bar"></div>
<div id="hud">
  <span id="info">initialising…</span>
  <label>iterations
    <input type="range" id="sl_iter" min="64" max="2048" step="32" value="512">
    <span id="iter_v">512</span>
  </label>
  <label>IFS weight
    <input type="range" id="sl_ifs" min="0" max="0.15" step="0.005" value="0.04">
    <span id="ifs_v">0.040</span>
  </label>
  <label>IFS period
    <input type="range" id="sl_per" min="1" max="10" step="1" value="3">
    <span id="per_v">3</span>
  </label>
  <button id="btn_reset">reset</button>
  <button id="btn_save">save PNG</button>
  <span id="hint">scroll: zoom infinitely &nbsp;|&nbsp; drag: pan &nbsp;|&nbsp; dblclick: centre+zoom</span>
</div>
<div id="webgl-error">
  <h2 style="color:#f88;margin-bottom:12px">WebGL not available</h2>
  <p>Try Chrome, Firefox, or Edge on a desktop machine.</p>
</div>

<script>
// ─── WebGL setup ────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true })
        || canvas.getContext('experimental-webgl', { preserveDrawingBuffer: true });

if (!gl) {
  document.getElementById('webgl-error').style.display = 'block';
  throw new Error('WebGL unavailable');
}

// ─── Vertex shader ──────────────────────────────────────────────────────────
const VS = `
attribute vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }`;

// ─── Fragment shader ─────────────────────────────────────────────────────────
// Full double-precision emulation via 4 floats per complex coordinate:
//   (cx_hi, cx_lo, cy_hi, cy_lo)  and zoom split similarly.
// This gives ~48 bits of mantissa — enough for zoom depths of ~1e12 before
// GPU float32 precision itself becomes the wall (around 1e14).
const FS = `
precision highp float;

uniform vec2  u_res;
// center and half-width passed as hi+lo pairs for ~48-bit precision
uniform vec2  u_cx_hilo;
uniform vec2  u_cy_hilo;
uniform vec2  u_zoom_hilo;
uniform int   u_maxiter;
uniform float u_ifs_w;
uniform float u_ifs_per;

// ── Dekker double-float arithmetic ─────────────────────────────────────────
vec2 df_add(vec2 a, vec2 b) {
  float s = a.x + b.x;
  float v = s  - a.x;
  float e = (a.x - (s - v)) + (b.x - v) + a.y + b.y;
  return vec2(s, e);
}
vec2 df_neg(vec2 a) { return vec2(-a.x, -a.y); }
vec2 df_sub(vec2 a, vec2 b) { return df_add(a, df_neg(b)); }
vec2 df_scale(vec2 a, float b) {
  float p = a.x * b;
  // No fma in WebGL 1 — use Dekker split to get the rounding error of p
  float bh = b - (b - b); // identity, keeps precision
  float e = (a.x * b - p) + a.y * b;
  return vec2(p, e);
}
float df_val(vec2 a) { return a.x + a.y; }

void main() {
  // Screen UV in [-1, 1]
  float fx = (gl_FragCoord.x / u_res.x - 0.5) * 2.0;
  float fy = (gl_FragCoord.y / u_res.y - 0.5) * 2.0;
  float ar  = u_res.x / u_res.y;

  // Map pixel to complex coordinate using double-float
  float cr = df_val(df_add(u_cx_hilo, df_scale(u_zoom_hilo, fx * ar)));
  float ci = df_val(df_add(u_cy_hilo, df_scale(u_zoom_hilo, fy)));

  // Sierpinski IFS attractor vertices
  const vec2 v0 = vec2(0.0,          0.0);
  const vec2 v1 = vec2(1.0,          0.0);
  const vec2 v2 = vec2(0.5, 0.866025403);

  float zr = 0.0, zi = 0.0;
  float esc = -1.0;

  for (int i = 0; i < 2048; i++) {
    if (i >= u_maxiter) break;

    // z = z² + c
    float zr2 = zr*zr - zi*zi + cr;
    float zi2 = 2.0*zr*zi   + ci;
    zr = zr2; zi = zi2;

    // IFS nudge every \`period\` iterations
    if (mod(float(i), u_ifs_per) < 1.0) {
      vec2 zv  = vec2(zr, zi);
      float d0 = dot(zv-v0, zv-v0);
      float d1 = dot(zv-v1, zv-v1);
      float d2 = dot(zv-v2, zv-v2);
      vec2 near;
      if (d0 <= d1 && d0 <= d2) near = v0;
      else if (d1 <= d2)        near = v1;
      else                      near = v2;
      zr += u_ifs_w * (near.x - zr);
      zi += u_ifs_w * (near.y - zi);
    }

    float r2 = zr*zr + zi*zi;
    if (r2 > 4.0) {
      float lg = log(max(sqrt(r2), 1.0001));
      float nu = float(i) + 1.0 - log(max(lg / log(2.0), 1e-6));
      esc = nu;
      break;
    }
  }

  // Interior
  if (esc < 0.0) {
    gl_FragColor = vec4(0.04, 0.01, 0.12, 1.0);
    return;
  }

  // Colour (tight banding gives detail at all zoom levels)
  float t = fract(esc / float(u_maxiter) * 14.0);

  vec3 col;
  if      (t < 0.10) col = mix(vec3(0.00,0.00,0.00), vec3(0.04,0.04,0.18), t/0.10);
  else if (t < 0.25) col = mix(vec3(0.04,0.04,0.18), vec3(0.05,0.17,0.43), (t-0.10)/0.15);
  else if (t < 0.40) col = mix(vec3(0.05,0.17,0.43), vec3(0.10,0.44,0.66), (t-0.25)/0.15);
  else if (t < 0.50) col = mix(vec3(0.10,0.44,0.66), vec3(0.00,0.83,1.00), (t-0.40)/0.10);
  else if (t < 0.60) col = mix(vec3(0.00,0.83,1.00), vec3(1.00,1.00,1.00), (t-0.50)/0.10);
  else if (t < 0.70) col = mix(vec3(1.00,1.00,1.00), vec3(1.00,0.88,0.40), (t-0.60)/0.10);
  else if (t < 0.80) col = mix(vec3(1.00,0.88,0.40), vec3(1.00,0.42,0.00), (t-0.70)/0.10);
  else if (t < 0.90) col = mix(vec3(1.00,0.42,0.00), vec3(0.75,0.00,0.24), (t-0.80)/0.10);
  else               col = mix(vec3(0.75,0.00,0.24), vec3(0.00,0.00,0.00), (t-0.90)/0.10);

  gl_FragColor = vec4(col, 1.0);
}`;

function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error('Shader: ' + gl.getShaderInfoLog(s));
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compileShader(gl.VERTEX_SHADER,   VS));
gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
  throw new Error('Link: ' + gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uRes    = gl.getUniformLocation(prog, 'u_res');
const uCxHilo = gl.getUniformLocation(prog, 'u_cx_hilo');
const uCyHilo = gl.getUniformLocation(prog, 'u_cy_hilo');
const uZmHilo = gl.getUniformLocation(prog, 'u_zoom_hilo');
const uIter   = gl.getUniformLocation(prog, 'u_maxiter');
const uIfsW   = gl.getUniformLocation(prog, 'u_ifs_w');
const uIfsPer = gl.getUniformLocation(prog, 'u_ifs_per');

// ─── Dekker split (JS side) ─────────────────────────────────────────────────
function split(x) {
  const t = (2**27 + 1) * x;
  const hi = t - (t - x);
  return [hi, x - hi];
}

// ─── State ───────────────────────────────────────────────────────────────────
// cx/cy use compensated double-float summation so panning stays accurate deep
let cx = -0.75, cy = 0.1;
let cx_e = 0, cy_e = 0;          // error accumulators
let zoom = 0.6;                   // half-width in complex units — NO lower bound
let maxiter = 512, ifsW = 0.04, ifsPer = 3;
let dirty = true;

// ─── Auto-boost iterations as we zoom deeper ─────────────────────────────────
function autoIter() {
  // Logarithmically increase iterations with zoom depth
  const depth = Math.log2(0.6 / Math.max(zoom, Number.MIN_VALUE));
  const auto  = Math.min(2048, Math.max(maxiter, Math.round(256 + depth * 28)));
  return auto;
}

// ─── Depth indicator bar ────────────────────────────────────────────────────
const depthBar = document.getElementById('depth-bar');
function updateDepthBar() {
  // Map zoom from 1 (shallow) to 1e-13 (deep) onto 0..1
  const d = Math.max(0, Math.min(1, -Math.log10(zoom / 0.6) / 13));
  depthBar.style.transform = `scaleX(${d})`;
}

// ─── Resize ──────────────────────────────────────────────────────────────────
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = (canvas.clientWidth  * dpr) | 0;
  const h = (canvas.clientHeight * dpr) | 0;
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width  = w;
    canvas.height = h;
    dirty = true;
  }
}

// ─── Render loop ─────────────────────────────────────────────────────────────
function draw() {
  resize();
  if (dirty) {
    dirty = false;

    // Represent center as hi+lo for the shader
    const [cxHi, cxLo] = split(cx);
    const [cyHi, cyLo] = split(cy);
    const [zmHi, zmLo] = split(zoom);

    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uRes,    canvas.width, canvas.height);
    gl.uniform2f(uCxHilo, cxHi, cxLo + cx_e);
    gl.uniform2f(uCyHilo, cyHi, cyLo + cy_e);
    gl.uniform2f(uZmHilo, zmHi, zmLo);
    gl.uniform1i(uIter,   autoIter());
    gl.uniform1f(uIfsW,   ifsW);
    gl.uniform1f(uIfsPer, ifsPer);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    const mag = 1 / zoom;
    const exp = Math.floor(Math.log10(mag));
    const man = (mag / 10**exp).toFixed(2);
    document.getElementById('info').textContent =
      `c = (${cx.toFixed(8)}, ${cy.toFixed(8)})   ×${man}e${exp}`;

    updateDepthBar();
  }
  requestAnimationFrame(draw);
}
draw();

// ─── Zoom helper — zoom towards a complex-plane point ───────────────────────
function zoomToward(mx_complex, my_complex, factor) {
  // Shift center so the point under cursor stays fixed
  cx += mx_complex * (1 - factor);
  cy += my_complex * (1 - factor);
  zoom *= factor;
  // No lower bound — the fractal is infinite
  dirty = true;
}

// ─── Mouse pan ────────────────────────────────────────────────────────────────
let drag = null;
canvas.addEventListener('mousedown', e => {
  drag = { x: e.clientX, y: e.clientY, cx, cy, cx_e, cy_e };
});
window.addEventListener('mousemove', e => {
  if (!drag) return;
  const ar = canvas.clientWidth / canvas.clientHeight;
  cx   = drag.cx   - (e.clientX - drag.x) / canvas.clientWidth  * zoom * 2 * ar;
  cy   = drag.cy   + (e.clientY - drag.y) / canvas.clientHeight * zoom * 2;
  cx_e = drag.cx_e;
  cy_e = drag.cy_e;
  dirty = true;
});
window.addEventListener('mouseup', () => { drag = null; });

// ─── Scroll zoom ─────────────────────────────────────────────────────────────
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 1.15 : 1 / 1.15;
  const ar = canvas.clientWidth / canvas.clientHeight;
  const mx = (e.offsetX / canvas.clientWidth  - 0.5) * zoom * 2 * ar;
  const my = (0.5 - e.offsetY / canvas.clientHeight) * zoom * 2;
  zoomToward(mx, my, factor);
}, { passive: false });

// ─── Double-click zoom ───────────────────────────────────────────────────────
canvas.addEventListener('dblclick', e => {
  const ar = canvas.clientWidth / canvas.clientHeight;
  const mx = (e.offsetX / canvas.clientWidth  - 0.5) * zoom * 2 * ar;
  const my = (0.5 - e.offsetY / canvas.clientHeight) * zoom * 2;
  cx += mx; cy += my;
  zoom /= 3;
  dirty = true;
});

// ─── Touch ───────────────────────────────────────────────────────────────────
let t0 = null, t1 = null;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    t0 = { x: e.touches[0].clientX, y: e.touches[0].clientY, cx, cy };
    t1 = null;
  } else if (e.touches.length === 2) {
    t1 = {
      dist: Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY),
      zoom
    };
    t0 = null;
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const ar = canvas.clientWidth / canvas.clientHeight;
  if (t0 && e.touches.length === 1) {
    cx = t0.cx - (e.touches[0].clientX - t0.x) / canvas.clientWidth  * zoom * 2 * ar;
    cy = t0.cy + (e.touches[0].clientY - t0.y) / canvas.clientHeight * zoom * 2;
    dirty = true;
  } else if (t1 && e.touches.length === 2) {
    const d = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY);
    zoom = t1.zoom * (t1.dist / d);
    dirty = true;
  }
}, { passive: false });

// ─── UI controls ─────────────────────────────────────────────────────────────
const slIter = document.getElementById('sl_iter');
const slIfs  = document.getElementById('sl_ifs');
const slPer  = document.getElementById('sl_per');

slIter.addEventListener('input', () => {
  maxiter = +slIter.value;
  document.getElementById('iter_v').textContent = maxiter;
  dirty = true;
});
slIfs.addEventListener('input', () => {
  ifsW = +slIfs.value;
  document.getElementById('ifs_v').textContent = ifsW.toFixed(3);
  dirty = true;
});
slPer.addEventListener('input', () => {
  ifsPer = +slPer.value;
  document.getElementById('per_v').textContent = ifsPer;
  dirty = true;
});

document.getElementById('btn_reset').addEventListener('click', () => {
  cx = -0.75; cy = 0.1; cx_e = 0; cy_e = 0; zoom = 0.6;
  maxiter = 512; ifsW = 0.04; ifsPer = 3;
  slIter.value = 512; slIfs.value = 0.04; slPer.value = 3;
  document.getElementById('iter_v').textContent = 512;
  document.getElementById('ifs_v').textContent  = '0.040';
  document.getElementById('per_v').textContent  = 3;
  dirty = true;
});

document.getElementById('btn_save').addEventListener('click', () => {
  dirty = true;
  requestAnimationFrame(() => {
    const a = document.createElement('a');
    a.download = `fractal_${Date.now()}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
  });
});
</script>
</body>
</html>
